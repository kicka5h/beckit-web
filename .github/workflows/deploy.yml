name: Deploy

# Ships main once CI has passed on it. Signs in to Google Cloud through Workload Identity
# Federation as beckit-deploy (infra/setup.sh), so no key is stored anywhere.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  web:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beckit/web build
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase Hosting
        run: >
          npx --yes firebase-tools@15.32.1 deploy --only hosting
          --project "${{ secrets.GCP_PROJECT_ID }}" --non-interactive
          --message "${{ github.event.workflow_run.head_sha || github.sha }}"
